<!DOCTYPE html>
<html>
<head>
  <title>Meeting the DOM</title>
</head>
<body>
  <h1>Mood Board</h1>
  <button id="themeBtn">Pick a Theme Color</button>
  <p id="status">Waiting for the coffee to brew (2 seconds)...</p>

  <script>
    const themeBtn = document.getElementById("themeBtn");
    themeBtn.addEventListener("click", () => {
      const color = prompt("Which color matches your mood today?");
      if (color) {
        document.body.style.backgroundColor = color;
      }
    });

    const status = document.getElementById("status");
    setTimeout(() => {
      status.textContent = "Coffee's ready. Time to code!";
    }, 2000);
  </script>
</body>
</html>
